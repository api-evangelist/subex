      call: revenue-assurance-revenue-assurance.getleakagealert
      with:
        leakageId: tools.leakageId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-leakage-alert-status
      description: Update leakage alert status
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: revenue-assurance-revenue-assurance.updateleakagealert
      with:
