naftiko: 1.0.0-alpha2
info:
  label: Subex Revenue Assurance & Fraud Management API — Revenue Assurance
  description: 'Subex Revenue Assurance & Fraud Management API — Revenue Assurance. 3 operations. Lead operation: List revenue
    leakage alerts. Self-contained Naftiko capability covering one Subex business surface.'
  tags:
  - Subex
  - Revenue Assurance
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUBEX_API_KEY: SUBEX_API_KEY
capability:
