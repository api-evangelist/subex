    baseUri: https://api.subex.example.com/roc/v1
    description: Subex Revenue Assurance & Fraud Management API — Revenue Assurance business capability. Self-contained, no
      shared references.
    resources:
    - name: revenue-assurance-leakages
      path: /revenue-assurance/leakages
      operations:
      - name: listleakagealerts
        method: GET
        description: List revenue leakage alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        - name: leakageType
          in: query
          type: string
        - name: severity
          in: query
          type: string
        - name: status
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: size
          in: query
          type: integer
    - name: revenue-assurance-leakages-leakageId
      path: /revenue-assurance/leakages/{leakageId}
      operations:
      - name: getleakagealert
        method: GET
        description: Get leakage alert details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: leakageId
          in: path
          type: string
          required: true
      - name: updateleakagealert
