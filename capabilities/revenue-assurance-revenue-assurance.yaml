      token: '{{env.SUBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: revenue-assurance-revenue-assurance-rest
    port: 8080
    description: REST adapter for Subex Revenue Assurance & Fraud Management API — Revenue Assurance. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/revenue-assurance/leakages
      name: revenue-assurance-leakages
      description: REST surface for revenue-assurance-leakages.
      operations:
      - method: GET
        name: listleakagealerts
        description: List revenue leakage alerts
        call: revenue-assurance-revenue-assurance.listleakagealerts
        with:
          startDate: rest.startDate
          endDate: rest.endDate
          leakageType: rest.leakageType
          severity: rest.severity
          status: rest.status
          page: rest.page
          size: rest.size
        outputParameters:
        - type: object
          mapping: $.
