naftiko: 1.0.0-alpha2
info:
  label: Subex Revenue Operations Center
  description: Unified capability for telecom revenue operations. Combines Subex ROC APIs for revenue leakage detection, fraud
    case management, subscriber risk scoring, CDR reconciliation, and analytics. Used by telecom operators' revenue assurance
    and fraud management teams.
  tags:
  - Subex
  - Telecom
  - Revenue Assurance
  - Fraud Management
  - CDR Reconciliation
  - Analytics
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SUBEX_BEARER_TOKEN: SUBEX_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: subex-roc
    baseUri: https://api.subex.example.com/roc/v1
    description: Subex ROC API for revenue assurance and fraud management.
    authentication:
      type: bearer
      token: '{{SUBEX_BEARER_TOKEN}}'
    resources:
    - name: revenue-leakages
      path: /revenue-assurance/leakages
      description: Revenue leakage alert management
      operations:
      - name: list-leakage-alerts
        method: GET
        description: List all revenue leakage alerts
        inputParameters:
        - name: startDate
          in: query
          type: string
          required: false
          description: Filter start date (YYYY-MM-DD)
        - name: endDate
          in: query
          type: string
          required: false
          description: Filter end date (YYYY-MM-DD)
        - name: leakageType
          in: query
          type: string
          required: false
          description: Filter by leakage type
        - name: severity
          in: query
          type: string
          required: false
          description: Filter by severity (CRITICAL, HIGH, MEDIUM, LOW)
        - name: status
          in: query
          type: string
          required: false
          description: Filter by status (OPEN, IN_PROGRESS, RESOLVED, CLOSED)
        - name: page
          in: query
          type: integer
          required: false
          description: Page number
        - name: size
          in: query
          type: integer
          required: false
          description: Page size
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: revenue-leakage
      path: /revenue-assurance/leakages/{leakageId}
      description: Individual leakage alert
      operations:
      - name: get-leakage-alert
        method: GET
        description: Get a specific revenue leakage alert by ID
        inputParameters:
        - name: leakageId
          in: path
          type: string
          required: true
          description: Leakage alert ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-leakage-alert
        method: PUT
        description: Update a leakage alert status or assignee
        inputParameters:
        - name: leakageId
          in: path
          type: string
          required: true
          description: Leakage alert ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: fraud-cases
      path: /fraud/cases
      description: Fraud case management
      operations:
      - name: list-fraud-cases
        method: GET
        description: List all fraud cases
        inputParameters:
        - name: fraudType
          in: query
          type: string
          required: false
          description: Filter by fraud type (SIM_SWAP, BYPASS_FRAUD, IRSF, etc.)
        - name: status
          in: query
          type: string
          required: false
          description: Filter by status
        - name: minRiskScore
          in: query
          type: integer
          required: false
          description: Minimum risk score filter
        - name: page
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: fraud-case
      path: /fraud/cases/{caseId}
      description: Individual fraud case
      operations:
      - name: get-fraud-case
        method: GET
        description: Get a specific fraud case by ID
        inputParameters:
        - name: caseId
          in: path
          type: string
          required: true
          description: Fraud case ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: subscriber-risk-score
      path: /fraud/subscribers/{msisdn}/risk-score
      description: Subscriber risk scoring
      operations:
      - name: get-subscriber-risk-score
        method: GET
        description: Get fraud risk score for a subscriber
        inputParameters:
        - name: msisdn
          in: path
          type: string
          required: true
          description: Subscriber MSISDN in international format
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reconciliation-runs
      path: /reconciliation/runs
      description: CDR reconciliation run management
      operations:
      - name: list-reconciliation-runs
        method: GET
        description: List CDR and billing reconciliation runs
        inputParameters:
        - name: status
          in: query
          type: string
          required: false
          description: Filter by run status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: analytics-summary
      path: /analytics/summary
      description: Revenue and risk analytics summary
      operations:
      - name: get-analytics-summary
        method: GET
        description: Get summary analytics for revenue assurance and fraud metrics
        inputParameters:
        - name: startDate
          in: query
          type: string
          required: false
        - name: endDate
          in: query
          type: string
          required: false
        - name: granularity
          in: query
          type: string
          required: false
          description: DAILY, WEEKLY, MONTHLY
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: subex-revenue-ops-api
    description: Unified REST API for Subex telecom revenue operations.
    resources:
    - path: /v1/leakages
      name: leakages
      description: Revenue leakage alerts
      operations:
      - method: GET
        name: list-leakage-alerts
        description: List revenue leakage alerts
        call: subex-roc.list-leakage-alerts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/leakages/{leakageId}
      name: leakage
      description: Individual leakage alert
      operations:
      - method: GET
        name: get-leakage-alert
        description: Get a leakage alert
        call: subex-roc.get-leakage-alert
        with:
          leakageId: rest.leakageId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/fraud-cases
      name: fraud-cases
      description: Fraud case management
      operations:
      - method: GET
        name: list-fraud-cases
        description: List fraud cases
        call: subex-roc.list-fraud-cases
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/fraud-cases/{caseId}
      name: fraud-case
      description: Individual fraud case
      operations:
      - method: GET
        name: get-fraud-case
        description: Get a fraud case
        call: subex-roc.get-fraud-case
        with:
          caseId: rest.caseId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/subscribers/{msisdn}/risk-score
      name: subscriber-risk-score
      description: Subscriber risk scoring
      operations:
      - method: GET
        name: get-subscriber-risk-score
        description: Get subscriber fraud risk score
        call: subex-roc.get-subscriber-risk-score
        with:
          msisdn: rest.msisdn
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reconciliation/runs
      name: reconciliation-runs
      description: CDR reconciliation
      operations:
      - method: GET
        name: list-reconciliation-runs
        description: List reconciliation runs
        call: subex-roc.list-reconciliation-runs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/analytics/summary
      name: analytics
      description: Revenue analytics
      operations:
      - method: GET
        name: get-analytics-summary
        description: Get analytics summary
        call: subex-roc.get-analytics-summary
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: subex-revenue-ops-mcp
    transport: http
    description: MCP server for AI-assisted Subex telecom revenue operations.
    tools:
    - name: list-leakage-alerts
      description: List Subex revenue leakage alerts with optional severity and type filters
      hints:
        readOnly: true
      call: subex-roc.list-leakage-alerts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-leakage-alert
      description: Get details of a specific revenue leakage alert
      hints:
        readOnly: true
      call: subex-roc.get-leakage-alert
      with:
        leakageId: tools.leakageId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-leakage-alert
      description: Update the status or assignment of a revenue leakage alert
      hints:
        readOnly: false
        destructive: false
      call: subex-roc.update-leakage-alert
      with:
        leakageId: tools.leakageId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-fraud-cases
      description: List telecom fraud cases with optional fraud type and status filters
      hints:
        readOnly: true
      call: subex-roc.list-fraud-cases
      outputParameters:
      - type: object
        mapping: $.
    - name: get-fraud-case
      description: Get details of a specific telecom fraud case
      hints:
        readOnly: true
      call: subex-roc.get-fraud-case
      with:
        caseId: tools.caseId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-subscriber-risk-score
      description: Get the fraud risk score for a telecom subscriber by their MSISDN
      hints:
        readOnly: true
      call: subex-roc.get-subscriber-risk-score
      with:
        msisdn: tools.msisdn
      outputParameters:
      - type: object
        mapping: $.
    - name: list-reconciliation-runs
      description: List CDR and billing reconciliation runs
      hints:
        readOnly: true
      call: subex-roc.list-reconciliation-runs
      outputParameters:
      - type: object
        mapping: $.
    - name: get-analytics-summary
      description: Get summary analytics for revenue assurance and fraud KPIs
      hints:
        readOnly: true
      call: subex-roc.get-analytics-summary
      outputParameters:
      - type: object
        mapping: $.
